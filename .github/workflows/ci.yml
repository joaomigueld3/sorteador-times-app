name: CI

on:
  push:
    branches:
      - develop
      - develop2
      - master
      - main
      - "refactor/**"
      - "feat/**"
      - "fix/**"
  pull_request:
    branches:
      - develop
      - develop2
      - master
      - main

jobs:
  verify:
    name: Build, Lint, Types, Tests & Spec Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Static lint check
        run: npm run lint

      - name: TypeScript typecheck
        run: npx tsc --noEmit

      - name: Run unit tests
        run: npm test

      - name: Spec-driven audit (ONP Spec)
        run: npm run spec:audit

      - name: Production build
        run: npm run build
